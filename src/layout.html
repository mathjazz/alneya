<!DOCTYPE html>
<html lang="{{ @lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="{{ @themeColor }}">
<title>{{ @pageMeta.title }}</title>
<meta name="description" content="{{ @pageMeta.description }}">
<link rel="canonical" href="{{ @canonical }}">
{{#each @hreflangs}}<link rel="alternate" hreflang="{{ .lang }}" href="{{ .absUrl }}">
{{/each}}
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{ site.name }}">
<meta property="og:locale" content="{{ meta.ogLocale }}">
{{#each @ogAlternates}}<meta property="og:locale:alternate" content="{{ .value }}">
{{/each}}
<meta property="og:title" content="{{ @pageMeta.title }}">
<meta property="og:description" content="{{ @pageMeta.description }}">
<meta property="og:url" content="{{ @canonical }}">
<meta property="og:image" content="{{ @assetsAbs }}/img/alneya-hero.jpg">
<meta name="twitter:card" content="summary_large_image">

<link rel="icon" href="{{ @assets }}/img/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="{{ @assets }}/img/apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..600&family=Montserrat:ital,wght@0,300..700;1,300..500&display=swap">
<script>document.documentElement.classList.add("js")</script>
<link rel="stylesheet" href="{{ @assets }}/css/site.css">
{{#each @themeFiles}}<link rel="stylesheet" href="{{ @assets }}/css/{{ .file }}">
{{/each}}

<script type="application/ld+json">{{{ @jsonLd }}}</script>
</head>
<body class="page page--{{ @page }} theme-{{ @theme }}">
<a class="skip-link" href="#main">{{ a11y.skipToContent }}</a>
{{> icons}}
{{> header}}
<main id="main">
{{{ @body }}}
</main>
{{> footer}}
<script src="{{ @assets }}/js/site.js" defer></script>
</body>
</html>
